name: Merge Upstream Artifacts

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Upstream release tag, or "latest"
        default: latest
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: push-artifacts
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      fonts: ${{ steps.release.outputs.fonts }}
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download and organize upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'latest' }}
          UPSTREAM_REPOSITORY: yuru7/HackGen
        run: |
          if [ "$RELEASE_TAG" = "latest" ]; then
            endpoint="releases/latest"
          else
            endpoint="releases/tags/$RELEASE_TAG"
          fi

          release_json="$(gh api "repos/$UPSTREAM_REPOSITORY/$endpoint")"
          tag="$(jq -r '.tag_name' <<< "$release_json")"
          archive_dir="$RUNNER_TEMP/upstream-fonts"
          mkdir -p "$archive_dir"

          mapfile -t asset_urls < <(
            jq -r '.assets[]
              | select(.name | test("\\.(zip|tar|tar\\.gz|tgz|tar\\.bz2|tbz2|tar\\.xz|txz)$"; "i"))
              | .browser_download_url' <<< "$release_json"
          )
          if [ "${#asset_urls[@]}" -eq 0 ]; then
            echo "No supported font archives found in upstream release $tag" >&2
            exit 1
          fi

          for url in "${asset_urls[@]}"; do
            curl --fail --location --retry 3 "$url" --output "$archive_dir/${url##*/}"
          done

          python .github/scripts/import-release-fonts.py \
            --archives "$archive_dir" \
            --destination fonts
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          git add --intent-to-add fonts
          changed_dir="$RUNNER_TEMP/changed-fonts"
          mkdir -p "$changed_dir"
          git diff --name-only --diff-filter=AMR -z -- fonts \
            | grep -ziE '\.(ttf|otf|ttc|otc|woff2?)$' \
            | xargs -0 -r cp --parents -t "$changed_dir" || true
          if [ -n "$(git status --porcelain -- fonts)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          fonts="$(cd "$changed_dir" && find . -type f -iname '*.ttf' | sed 's|^\./||' | sort | jq -R . | jq -sc .)"
          echo "fonts=$fonts" >> "$GITHUB_OUTPUT"

      - name: Create or update release PR
        id: cpr
        if: steps.release.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: master
          branch: automation/update-hackgen-fonts
          delete-branch: true
          title: "[bot] Update HackGen fonts to ${{ steps.release.outputs.tag }}"
          commit-message: "Update HackGen fonts to ${{ steps.release.outputs.tag }}"
          author-name: github-actions[bot]
          author-email: github-actions[bot]@users.noreply.github.com
          committer-name: github-actions[bot]
          committer-email: github-actions[bot]@users.noreply.github.com
          body: |
            Import the font files from the upstream HackGen release `${{ steps.release.outputs.tag }}`.

            FontBakery checks run after this pull request is created or updated.

      - name: Upload changed fonts
        if: steps.release.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changed-fonts
          path: ${{ runner.temp }}/changed-fonts
          retention-days: 1

  check-fonts:
    needs: import
    if: needs.import.outputs.fonts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        font: ${{ fromJSON(needs.import.outputs.fonts) }}
    steps:
      - name: Download changed fonts
        uses: actions/download-artifact@v4
        with:
          name: changed-fonts
          path: changed-fonts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FontBakery
        run: python -m pip install "fontbakery[googlefonts]"

      - name: Check font with FontBakery
        shell: bash
        env:
          FONT: ${{ matrix.font }}
        run: |
          status=0
          fontbakery check-googlefonts "changed-fonts/$FONT" > fontbakery.log 2>&1 || status=$?
          cat fontbakery.log
          {
            echo "### $FONT"
            echo '```'
            cat fontbakery.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  release:
    needs: import
    if: needs.import.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download changed fonts
        uses: actions/download-artifact@v4
        with:
          name: changed-fonts
          path: changed-fonts

      - name: Create GitHub release with font files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.import.outputs.tag }}
          UPSTREAM_REPOSITORY: yuru7/HackGen
        run: |
          mapfile -d '' -t assets < <(find changed-fonts -type f -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No changed font files are available to attach" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --title "HackGen $RELEASE_TAG" \
            --notes "Font files imported from https://github.com/$UPSTREAM_REPOSITORY/releases/tag/$RELEASE_TAG." \
            --target master
